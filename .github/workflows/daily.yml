name: daily-collect

on:
  schedule:
    # Minute "ciudate": GitHub sare uneori programarile la ora fixa (:00) cand e aglomerat.
    - cron: '17 3 * * *'   # principal
    - cron: '47 6 * * *'   # rezerva: ruleaza doar daca ziua nu a fost deja colectata
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Rulare de proba (putine cereri)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.d.outputs.date }}
      skip: ${{ steps.d.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - id: d
        run: |
          D=$(date -u +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          # La rularea programata, sarim daca ziua e deja colectata complet (de o rulare anterioara).
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/days/$D/US.json.gz" ] \
             && zcat "data/days/$D/US.json.gz" | grep -q '"complete":true'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Ziua $D e deja colectata."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        country: [US, GB, DE, FR, IT, ES]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Colectare ${{ matrix.country }}
        run: node src/collect/cli.js --country ${{ matrix.country }} --date ${{ needs.plan.outputs.date }} ${{ inputs.smoke && '--smoke' || '' }}
      - uses: actions/upload-artifact@v6
        with:
          name: data-${{ matrix.country }}
          path: |
            data/days/${{ needs.plan.outputs.date }}/${{ matrix.country }}.json.gz
            data/classify/${{ needs.plan.outputs.date }}/${{ matrix.country }}.json.gz
            data/apps/${{ needs.plan.outputs.date }}/${{ matrix.country }}.json.gz
            data/stats/${{ needs.plan.outputs.date }}/${{ matrix.country }}.json.gz
          if-no-files-found: warn
          retention-days: 3

  commit:
    needs: [plan, collect]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: data-*
          merge-multiple: true
          path: data
      - name: Status
        run: node src/collect/finalize.js --date ${{ needs.plan.outputs.date }}
      - name: Commit
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: ${{ needs.plan.outputs.date }}" || echo "nimic de salvat"
          git pull --rebase
          git push
